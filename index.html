<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dog Explorer</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>

        <h1>🐶 Dog Explorer</h1>

        <p>
            Descubra informações sobre diversas raças de cachorro.
        </p>

    </header>


    <main>

        <section class="pesquisa">

            <input
                type="text"
                id="campo-raca"
                placeholder="Digite uma raça (ex: labrador)"
            >

            <button id="botao-buscar">

                Buscar

            </button>

        </section>


        <section id="resultado">

            <h2>

                Pesquise uma raça para começar.

            </h2>

        </section>
    
        <section id="favoritos">
            <h2>⭐ Meus Favoritos</h2>
            <div id="lista-favoritos"></div>
    
        </section>

    
    
    
    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
